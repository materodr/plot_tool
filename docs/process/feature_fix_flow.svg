<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2314" viewBox="0 0 1500 2314" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="a1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ab91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="750.0" y="48" text-anchor="middle" font-size="24" font-weight="700">plot_tool — from feature or fix issue to merge into develop</text><rect x="216.0" y="414" width="648.0" height="712" rx="14" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="8 5"/><text x="204.0" y="770.0" transform="rotate(-90 204.0 770.0)" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Implementer loop — no PR, no CI</text><rect x="216.0" y="1236" width="648.0" height="396" rx="14" fill="none" stroke="#15803d" stroke-width="1.4" stroke-dasharray="8 5"/><text x="204.0" y="1434.0" transform="rotate(-90 204.0 1434.0)" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Reviewer — the only one working on the branch</text><rect x="240.0" y="110" width="600" height="70" rx="12" fill="#fde7c8" stroke="#c77700" stroke-width="1.6"/><text x="540" y="140.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">1. Feature or Fix issue, from its template</text><text x="540" y="160.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">Fix: bug description, severity, steps to reproduce</text><rect x="240.0" y="214" width="600" height="70" rx="12" fill="#fde7c8" stroke="#c77700" stroke-width="1.6"/><text x="540" y="244.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">2. Owner approves HLFR, PCR and COR texts, if any</text><text x="540" y="264.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">edge cases listed · direct link</text><rect x="240.0" y="318" width="600" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="540" y="348.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">3. Branch feature/&lt;n&gt;-… or fix/&lt;n&gt;-… from develop</text><text x="540" y="368.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">own worktree</text><rect x="240.0" y="448" width="600" height="70" rx="12" fill="#fde7c8" stroke="#c77700" stroke-width="1.6"/><text x="540" y="478.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">4. FIRST QUESTION BATCH to the owner</text><text x="540" y="498.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">before any code or test · recorded in the issue Q&amp;A</text><rect x="240.0" y="552" width="600" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="540" y="582.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">5a. Requirement revision</text><text x="540" y="602.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">check_requirements = 0 problems</text><rect x="240.0" y="656" width="600" height="50" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="540" y="686.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">5b. Code</text><rect x="240.0" y="740" width="600" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="540" y="770.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">5c. Tests the implementer deems necessary</text><text x="540" y="790.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">Fix: a test that reproduces the bug</text><rect x="240.0" y="844" width="600" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="540" y="874.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">5d. Branch up to date with develop?</text><text x="540" y="894.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">if not, bring develop in</text><polygon points="240.0,975.0 268.0,948 812.0,948 840.0,975.0 812.0,1002 268.0,1002" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="540" y="980.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">5e. New questions?</text><polygon points="240.0,1073.0 268.0,1036 812.0,1036 840.0,1073.0 812.0,1110 268.0,1110" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/><text x="540" y="1068.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">6. Handover?</text><text x="540" y="1088.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">no questions · satisfied · branch up to date</text><rect x="240.0" y="1170" width="600" height="40" rx="12" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="540" y="1195.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">IMPLEMENTER FROZEN — changes nothing</text><rect x="240.0" y="1270" width="600" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="540" y="1300.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">7. Analyses code · requirements · tests · issue Q&amp;A</text><text x="540" y="1320.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">Fix: checks the bug-reproducing test</text><rect x="240.0" y="1374" width="600" height="50" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="540" y="1404.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">8. Adds its own tests (tests/ only)</text><rect x="240.0" y="1458" width="600" height="50" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="540" y="1488.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">9. Runs the tests it deems necessary</text><polygon points="240.0,1579.0 268.0,1542 812.0,1542 840.0,1579.0 812.0,1616 268.0,1616" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="540" y="1574.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">10–12. No findings?</text><text x="540" y="1594.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">Branch still up to date?</text><rect x="240.0" y="1676" width="600" height="40" rx="12" fill="#fff5f5" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="540" y="1701.0" text-anchor="middle" font-size="15" font-weight="600" fill="#b91c1c">GREEN LIGHT — BRANCH FROZEN · nobody changes it</text><rect x="240.0" y="1750" width="600" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="540" y="1780.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">13. Open the PR into develop</text><text x="540" y="1800.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">Fail* section (or &#x27;none&#x27;) · Req. validation</text><text x="540" y="1820.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">Closes #n · Green light: &lt;SHA&gt;</text><polygon points="240.0,1911.0 268.0,1874 812.0,1874 840.0,1911.0 812.0,1948 268.0,1948" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="540" y="1906.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">14. CI: full suite once + requirement checks</text><text x="540" y="1926.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">(docs-only PR: suite skipped)</text><rect x="240.0" y="1982" width="600" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="540" y="2012.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">18. Issue sections filled</text><text x="540" y="2032.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">Feature: How · Tests used · Evidence  |  Fix: Solution · How tested · Evidence</text><rect x="240.0" y="2086" width="600" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="540" y="2116.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">19. Reviewer merges into develop</text><text x="540" y="2136.0" text-anchor="middle" font-size="15" font-weight="400" fill="#000">CI passed, or only declared Fail*</text><rect x="240.0" y="2190" width="600" height="50" rx="12" fill="#e5e7eb" stroke="#374151" stroke-width="1.6"/><text x="540" y="2220.0" text-anchor="middle" font-size="15" font-weight="600" fill="#000">20. Owner told, with the link</text><line x1="540" y1="180" x2="540" y2="212" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="284" x2="540" y2="316" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="388" x2="540" y2="446" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="518" x2="540" y2="550" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="622" x2="540" y2="654" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="706" x2="540" y2="738" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="810" x2="540" y2="842" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="914" x2="540" y2="946" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="1002" x2="540" y2="1034" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><text x="550" y="1024.0" font-size="13" fill="#333">no</text><line x1="540" y1="1110" x2="540" y2="1168" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><text x="550" y="1145.0" font-size="13" fill="#333">yes</text><line x1="540" y1="1210" x2="540" y2="1268" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="1340" x2="540" y2="1372" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="1424" x2="540" y2="1456" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="1508" x2="540" y2="1540" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="1616" x2="540" y2="1674" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><text x="550" y="1651.0" font-size="13" fill="#333">yes</text><line x1="540" y1="1716" x2="540" y2="1748" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="1840" x2="540" y2="1872" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="1948" x2="540" y2="1980" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><text x="550" y="1970.0" font-size="13" fill="#333">pass / only declared Fail*</text><line x1="540" y1="2052" x2="540" y2="2084" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><line x1="540" y1="2156" x2="540" y2="2188" stroke="#444" stroke-width="1.6" marker-end="url(#a444)"/><polyline points="840.0,975.0 900,975.0 900,564.0 844.0,564.0" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#a1d4ed8)"/><text x="1036" y="971.0" font-size="13" fill="#1d4ed8">yes: one batch to the owner,</text><text x="1036" y="987.0" font-size="13" fill="#1d4ed8">recorded in the issue</text><polyline points="840.0,1073.0 940,1073.0 940,579.3333333333334 844.0,579.3333333333334" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#a1d4ed8)"/><text x="1036" y="1077.0" font-size="13" fill="#1d4ed8">not yet</text><polyline points="840.0,1579.0 980,1579.0 980,594.6666666666666 844.0,594.6666666666666" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ab91c1c)"/><text x="1036" y="1575.0" font-size="13" fill="#b91c1c">findings → reject</text><text x="1036" y="1591.0" font-size="13" fill="#b91c1c">develop moved → outdated</text><polyline points="840.0,1911.0 1020,1911.0 1020,610.0 844.0,610.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ab91c1c)"/><text x="1036" y="1899.0" font-size="13" fill="#b91c1c">15. commit after CI started → CI stops</text><text x="1036" y="1915.0" font-size="13" fill="#b91c1c">16. develop moved → outdated</text><text x="1036" y="1931.0" font-size="13" fill="#b91c1c">17. CI fails → reject</text><rect x="26" y="80" width="190" height="300" rx="12" fill="#fafafa" stroke="#999"/><text x="40" y="102" font-size="15" font-weight="700">Legend</text><rect x="40" y="120" width="160" height="30" rx="8" fill="#fde7c8" stroke="#c77700"/><text x="120" y="140" text-anchor="middle" font-size="14" fill="#000">Owner</text><rect x="40" y="162" width="160" height="30" rx="8" fill="#dbeafe" stroke="#1d4ed8"/><text x="120" y="182" text-anchor="middle" font-size="14" fill="#000">Implementer</text><rect x="40" y="204" width="160" height="30" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="120" y="224" text-anchor="middle" font-size="14" fill="#000">Reviewer</text><rect x="40" y="246" width="160" height="30" rx="8" fill="#ede9fe" stroke="#6d28d9"/><text x="120" y="266" text-anchor="middle" font-size="14" fill="#000">CI</text><rect x="40" y="288" width="160" height="30" rx="8" fill="#fff5f5" stroke="#b91c1c" stroke-dasharray="6 4"/><text x="120" y="308" text-anchor="middle" font-size="14" fill="#b91c1c">Frozen state</text><line x1="40" y1="345" x2="90" y2="345" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="7 5"/><text x="98" y="349" font-size="13" fill="#b91c1c">back to the</text><text x="98" y="365" font-size="13" fill="#b91c1c">implementer (5a)</text></svg>