name: Tests

# Runs every test with PyQt6 offscreen, builds the test matrix
# (PCR-00019 to PCR-00023, PCR-00042) and checks PEP 8 (COR-00002).
# A pull request runs every test (PCR-00057, PCR-00058) when it changes
# a file of the list of PCR-00078, and a release pull request from
# develop into main always does. Otherwise the "Decide" step skips the
# steps that run or need the tests (PCR-00079, PCR-00083); the job still
# reports success, so the required check never blocks a merge. Only an
# explicit decision "false" skips: a crash of the decision runs
# everything. The tests run only on pull requests: the run of a pull
# request already tested the merged code, because its branch is up to
# date (PCR-00060). Pushes to develop and main run only the requirement
# checks. CI posts the matrix of each pull request on it; after a
# release, an agent puts the release run's matrix in tests/test_matrix.md
# through the matrix pull requests of PCR-00061 and PCR-00085.
on:
  pull_request:
  push:
    branches: [develop, main]

# PCR-00107: a new commit on the branch of a pull request cancels the
# run of the earlier commit, and the green-light check sends the work back
# to the implementer (PCR-00106).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # commit HDF5 sample files on pull request branches
  pull-requests: write   # post the test matrix on pull requests

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PCR-00078, PCR-00079, PCR-00083: tests/ci_changed_files.py
      # compares the head of the pull request with its base and writes
      # full_suite=true or false. pipefail makes a crash of the script
      # fail this step instead of hiding behind tee; the step may fail
      # (continue-on-error), and every later step runs unless the decision
      # is exactly "false", so a crash runs every test.
      - name: Decide whether every test runs
        id: changes
        continue-on-error: true
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -o pipefail
          python tests/ci_changed_files.py --base "$BASE_BRANCH" \
            --head "$HEAD_COMMIT" --head-branch "$HEAD_BRANCH" \
            --github-output "$GITHUB_OUTPUT" | tee changed_files.txt
          if grep -q "^full_suite=false" "$GITHUB_OUTPUT"; then
            echo "::notice title=Tests skipped (PCR-00079, PCR-00083)::no file of the list of PCR-00078 changed, or only the test matrix; the requirement checks still run"
            {
              echo "## Tests skipped (PCR-00079, PCR-00083)"
              echo
              echo "No file of the list of PCR-00078 changed, or only the test matrix changed, so no test runs. The requirement checks still run (PCR-00080)."
              echo
              echo '```'
              cat changed_files.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install system libraries for Qt
        if: steps.changes.outputs.full_suite != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3

      # PCR-00072: on a pull request into develop only, when PyQt6 or
      # h5py can't be installed on the runner, the other packages are
      # still installed and the tests that need the missing one are shown
      # as Fail* (--environment-limit), with a justification that names
      # the failed install. Into any other branch, and for any other
      # failed install, the job fails (PCR-00069).
      - name: Install Python packages
        env:
          FULL_SUITE: ${{ steps.changes.outputs.full_suite }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          python -m pip install --upgrade pip
          # PCR-00079, PCR-00083: with no test to run, only the PEP 8
          # checker.
          if [ "$FULL_SUITE" = "false" ]; then
            pip install pycodestyle
            exit 0
          fi
          if pip install -r requirements.txt pycodestyle; then exit 0; fi
          if [ "$BASE_BRANCH" != "develop" ]; then
            echo "::error title=Install failed::pip install failed, and the environment Fail* is accepted only into develop (PCR-00069, PCR-00072)"
            exit 1
          fi
          grep -viE '^(pyqt6|h5py)\b' requirements.txt > requirements_core.txt
          pip install -r requirements_core.txt pycodestyle
          failed_install_str=""
          for package_str in PyQt6 h5py; do
            requirement_str=$(grep -iE "^$package_str\b" requirements.txt | cut -d' ' -f1)
            pip install "$requirement_str" || failed_install_str="$failed_install_str $package_str"
          done
          if [ -n "$failed_install_str" ]; then
            echo "PLOT_TOOL_ENVIRONMENT_LIMIT=pip install of${failed_install_str} failed on the GitHub runner." >> "$GITHUB_ENV"
            echo "::warning title=Environment limit::pip install of${failed_install_str} failed; those tests are shown as Fail*"
          fi

      - name: Check PEP 8
        run: python -m pycodestyle src tests

      # COR-00023: h5py can't be installed where some agents work, so
      # when good/signals.h5 is missing CI writes the HDF5 sample files
      # and commits them to the pull request branch (same-repository
      # branches only). The checkout is the merge commit, so the files
      # are committed on a separate worktree of the branch head. Pushes
      # made with the workflow token don't start another run.
      - name: Generate and commit missing HDF5 sample files
        if: >-
          steps.changes.outputs.full_suite != 'false' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          env.PLOT_TOOL_ENVIRONMENT_LIMIT == ''
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -f tests/user_tests/good/signals.h5 ]; then exit 0; fi
          python tests/user_tests/make_user_test_files.py --hdf5-only
          git fetch origin "refs/heads/$HEAD_REF"
          git worktree add --detach ../head_branch FETCH_HEAD
          for path in tests/user_tests/good/*.h5 tests/user_tests/bad/*.h5; do
            cp "$path" "../head_branch/$path"
          done
          cd ../head_branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/user_tests/good/*.h5 tests/user_tests/bad/*.h5
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add HDF5 sample files generated by CI run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "::notice title=HDF5 sample files committed::pull the branch before pushing again"

      # --require-qt and --require-h5py fail the run instead of letting
      # the GUI and HDF5 tests skip, unless the install step set
      # PLOT_TOOL_ENVIRONMENT_LIMIT (PCR-00072). On a pull request, --base and --head
      # also fail the run when an HLFR that the branch affects has no
      # test (PCR-00059).
      - name: Run tests and build the test matrix
        if: steps.changes.outputs.full_suite != 'false'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          affected_option_list=()
          if [ -n "$BASE_BRANCH" ]; then
            affected_option_list=(--base "$BASE_BRANCH" --head "$HEAD_COMMIT")
          fi
          if [ -n "$PLOT_TOOL_ENVIRONMENT_LIMIT" ]; then
            affected_option_list+=(--environment-limit "$PLOT_TOOL_ENVIRONMENT_LIMIT")
          fi
          python tests/build_test_matrix.py --require-qt --require-h5py \
            --output test_matrix_ci.md "${affected_option_list[@]}"

      # PCR-00060 to PCR-00062, PCR-00069, PCR-00081, PCR-00085: the
      # branch is up to date and leaves tests/test_matrix.md as develop
      # has it (a test matrix branch changes only that file); the matrix
      # of this run shows no failed test; into main it shows no Fail* of
      # any kind. Of the description, only the environment Fail* of this
      # run is checked here (PCR-00070), so that an edit of the
      # description almost never needs this job again; the
      # fail-star-section job checks the rest on every edit. An
      # environment Fail* counts as passed into develop only (PCR-00064).
      # When the tests are skipped (PCR-00079, PCR-00083), only the
      # branch is checked. The description goes through an environment
      # variable, so its text is never read as shell code.
      - name: Check the branch and the matrix of this run
        if: >-
          github.event.pull_request.base.ref == 'develop' ||
          github.event.pull_request.base.ref == 'main'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PULL_REQUEST_BODY" > pull_request_body.md
          python tests/check_pr_ready.py --base "$BASE_BRANCH" \
            --head "$HEAD_COMMIT" --head-branch "$HEAD_BRANCH" \
            --ci-matrix test_matrix_ci.md --body-file pull_request_body.md

      - name: Show the test matrix
        if: always()
        run: |
          if [ -f test_matrix_ci.md ]; then
            cat test_matrix_ci.md
            cat test_matrix_ci.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post the test matrix on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f test_matrix_ci.md ]; then exit 0; fi
          {
            echo "<!-- test-matrix -->"
            echo "CI run for commit ${{ github.event.pull_request.head.sha }}"
            echo
            cat test_matrix_ci.md
          } > matrix_comment.md
          # GitHub refuses comments longer than 262144 characters (HTTP
          # 422): cut a longer matrix and point to the full one, which
          # is in the step summary and the "test-matrix" artifact.
          limit_i=255000
          if [ "$(wc -m < matrix_comment.md)" -gt "$limit_i" ]; then
            python3 - "$limit_i" <<'PYTHON'
          import sys
          limit_i = int(sys.argv[1])
          with open("matrix_comment.md", encoding="utf-8") as comment_file:
              text_str = comment_file.read()
          cut_str = text_str[:limit_i].rsplit("\n", 1)[0]
          cut_str += ("\n\n_The test matrix is too long for a comment and "
                      "was cut here. The full matrix is in the run's step "
                      "summary and in its \"test-matrix\" artifact._\n")
          with open("matrix_comment.md", "w", encoding="utf-8") as comment_file:
              comment_file.write(cut_str)
          PYTHON
          fi
          # Update the existing matrix comment, or create it the first time.
          comment_id=$(gh api "repos/$REPOSITORY/issues/$PULL_NUMBER/comments" \
            --paginate --jq '.[] | select(.body | startswith("<!-- test-matrix -->")) | .id' | tail -1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" \
              -F body=@matrix_comment.md > /dev/null
          else
            gh api "repos/$REPOSITORY/issues/$PULL_NUMBER/comments" \
              -F body=@matrix_comment.md > /dev/null
          fi

      # Screenshots of the real window, so reviewers can see the
      # interface: posted as base64 comments (read them back with
      # tests/user_tests/fetch_screenshots.py) and uploaded as an
      # artifact. Earlier screenshot comments of the PR are replaced.
      - name: Make screenshots of the interface
        if: >-
          always() && github.event_name == 'pull_request' &&
          steps.changes.outputs.full_suite != 'false' &&
          env.PLOT_TOOL_ENVIRONMENT_LIMIT == ''
        run: python tests/user_tests/make_screenshots.py --output screenshots

      - name: Post the screenshots on the pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls screenshots/*.png > /dev/null 2>&1; then exit 0; fi
          python tests/user_tests/post_screenshots.py \
            ${{ github.event.pull_request.number }} \
            --input screenshots --repository "${{ github.repository }}" \
            --commit "${{ github.event.pull_request.head.sha }}"

      - name: Upload the screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: ignore

      - name: Upload the test matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-matrix
          path: test_matrix_ci.md
          if-no-files-found: ignore

  # PCR-00037 and PCR-00038: test the quality of the requirements and
  # post the result on the pull request. A separate job, so a problem in
  # the requirements doesn't hide the results of the tests above.
  requirements-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the quality of the requirements
        run: python tests/check_requirements.py --output requirements_quality.md

      - name: Show the result
        if: always()
        run: |
          if [ -f requirements_quality.md ]; then
            cat requirements_quality.md
            cat requirements_quality.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post the result on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f requirements_quality.md ]; then exit 0; fi
          {
            echo "<!-- requirements-quality -->"
            echo "CI run for commit ${{ github.event.pull_request.head.sha }}"
            echo
            cat requirements_quality.md
          } > quality_comment.md
          # Update the existing comment, or create it the first time.
          comment_id=$(gh api "repos/$REPOSITORY/issues/$PULL_NUMBER/comments" \
            --paginate --jq '.[] | select(.body | startswith("<!-- requirements-quality -->")) | .id' | tail -1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" \
              -F body=@quality_comment.md > /dev/null
          else
            gh api "repos/$REPOSITORY/issues/$PULL_NUMBER/comments" \
              -F body=@quality_comment.md > /dev/null
          fi
