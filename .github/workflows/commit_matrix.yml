name: Commit test matrix

# PCR-00019 and PCR-00022: keep the committed matrix at the last run. The
# pull request already ran every test (PCR-00057), so this reuses its
# matrix instead of running them again. Runs for develop queue here
# (cancel-in-progress: false) instead of racing each other. Pushes made
# with the workflow token don't start another run, so this doesn't loop.
on:
  push:
    branches: [develop]

permissions:
  contents: write        # commit tests/test_matrix.md on develop
  actions: read          # download the pull request's matrix
  pull-requests: read    # find the pull request of the merge

concurrency:
  group: test-matrix-commit
  cancel-in-progress: false

jobs:
  commit-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the matrix of the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash tests/ci/download_pr_matrix.sh
          "$GITHUB_REPOSITORY" "$GITHUB_SHA" matrix_artifact

      - name: Commit the test matrix to develop
        run: >-
          bash tests/ci/commit_test_matrix.sh
          matrix_artifact/test_matrix_ci.md "$GITHUB_SHA" "$GITHUB_RUN_ID"
