name: Requirements review

# PCR-00051 and PCR-00053: a pull request must show the result of the
# requirements review it needs. Into main that is PCR-00050, and into
# develop PCR-00052, when the branch adds a requirement. PCR-00070: the
# description must start with the Fail* section, which lists every HLFR
# of tests/not_implemented.txt and every environment Fail* of the matrix
# that the tests job posted for the head commit, or holds the single
# entry "none"; into main it holds no Fail* (PCR-00069). A separate
# workflow, so that editing the description runs only these short checks
# and not the whole test suite.
# The description goes through an environment variable, so its text is
# never read as shell code.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read   # read the test matrix comment of the tests job
  issues: read

jobs:
  requirement-validation-section:
    runs-on: ubuntu-latest
    steps:
      # The whole history, to find what the branch adds to its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the requirements review section
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PULL_REQUEST_BODY" > pull_request_body.md
          python tests/check_requirement_review.py \
            --body-file pull_request_body.md \
            --base "$BASE_BRANCH" --head "$HEAD_COMMIT"

  # PCR-00070: the reviewer sees every Fail*, with its justification, at
  # the top of the description, or "none".
  fail-star-section:
    runs-on: ubuntu-latest
    steps:
      # The whole history, to read tests/not_implemented.txt of the head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The matrix comment of the tests job for this head commit, if it
      # is already posted; on a new push it comes later, and the tests
      # job itself checks the environment Fail* of its run.
      - name: Check the Fail* section
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s' "$PULL_REQUEST_BODY" > pull_request_body.md
          gh api "repos/$REPOSITORY/issues/$PULL_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- test-matrix -->")) | .body' \
            > matrix_comments.md || true
          python3 - "$HEAD_COMMIT" <<'PYTHON'
          import sys
          head_str = sys.argv[1]
          with open("matrix_comments.md", encoding="utf-8") as comment_file:
              text_str = comment_file.read()
          comment_list = text_str.split("<!-- test-matrix -->")
          found_list = [comment_str for comment_str in comment_list
                        if f"CI run for commit {head_str}" in comment_str]
          with open("run_matrix.md", "w", encoding="utf-8") as matrix_file:
              matrix_file.write(found_list[-1] if found_list else "")
          PYTHON
          python tests/check_pr_ready.py --body-file pull_request_body.md \
            --base "$BASE_BRANCH" --head "$HEAD_COMMIT" \
            --run-matrix run_matrix.md

  # PCR-00105, PCR-00111, PCR-00112: after the reviewer's green light,
  # nobody changes the branch. The description records the green-light
  # commit as `Green light: <SHA>`; a pull request into develop whose head
  # is another commit fails here, also after a merge of develop or a
  # conflict fix, and the work goes back to the implementer (PCR-00106,
  # PCR-00110). The matrix pull request of PCR-00085 has no review
  # (PCR-00087). Releases into main follow PCR-00050.
  green-light:
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the green light
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          printf '%s' "$PULL_REQUEST_BODY" > pull_request_body.md
          python tests/check_pr_ready.py --green-light \
            --body-file pull_request_body.md --base "$BASE_BRANCH" \
            --head "$HEAD_COMMIT" --head-branch "$HEAD_BRANCH"
